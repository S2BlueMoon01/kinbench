<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, follow">
<title>Kinbench</title>
<!-- Saved choice from the language switcher, else the browser language: vi* → /vi, anything else → /en. -->
<script>var l;try{l=localStorage.getItem('kinbench:locale')}catch(e){}if(l!=='vi'&&l!=='en')l=/^vi\b/i.test(navigator.language||'')?'vi':'en';location.replace('/'+l)</script>
</head>
<body>
<main>
<h1>Kinbench</h1>
<p><a href="/vi" hreflang="vi" lang="vi">Tiếng Việt</a> · <a href="/en" hreflang="en">English</a></p>
</main>
</body>
</html>
