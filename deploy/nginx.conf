# Kinbench on nginx: copy out/ to the root below and this file plus nginx-security-headers.conf to the server.
server {
    listen 80;
    server_name kinbench.example;
    root /var/www/kinbench/out;

    include /etc/nginx/kinbench/nginx-security-headers.conf;

    # Clean URLs, as the static export expects: /en/tools/base64 -> /en/tools/base64.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;

    # Content-hashed files never change, so browsers may keep them for a year.
    location /_next/static/ {
        include /etc/nginx/kinbench/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Function Runner and benchmark sandboxes: their own CSP allows eval() but no network at all (see csp.config.mjs).
    location ~ ^/(runner|bench)\.worker\.js$ {
        include /etc/nginx/kinbench/nginx-security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'" always;
    }
}
