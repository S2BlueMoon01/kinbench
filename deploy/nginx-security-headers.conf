# Included by nginx.conf in every block that sends headers (nginx drops inherited add_header lines in a
# location that has its own). Must match csp.config.mjs; scripts/deploy.test.mjs fails if it drifts.
add_header Content-Security-Policy "connect-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
